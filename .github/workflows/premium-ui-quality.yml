name: Premium UI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ['refactor/premium-enterprise-ui']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
