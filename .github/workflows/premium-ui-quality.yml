name: Premium UI Quality Gate\n\non:\n  pull_request:\n    branches: [main]\n  push:\n    branches: ['refactor/premium-enterprise-ui']\n\njobs:\n  quality:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 24\n      - run: npm install\n      - name: Run tests\n        run: npm test\n      - name: Type check\n        run: npm run typecheck\n      - name: Lint\n        run: npm run lint\n      - name: Production build\n        run: vite build\n\n  diagnostics:\n    if: always()\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 24\n      - run: npm install\n      - name: Collect diagnostics\n        shell: bash\n        run: |\n          set +e\n          npm test > /tmp/test.log 2>&1\n          TEST=$?\n          npm run typecheck > /tmp/typecheck.log 2>&1\n          TYPECHECK=$?\n          npm run lint > /tmp/lint.log 2>&1\n          LINT=$?\n          {\n            echo '## Premium UI diagnostics'\n            echo ''\n            echo "**test exit:** $TEST"\n            echo '```text'\n            tail -n 80 /tmp/test.log\n            echo '```'\n            echo ''\n            echo "**typecheck exit:** $TYPECHECK"\n            echo '```text'\n            tail -n 120 /tmp/typecheck.log\n            echo '```'\n            echo ''\n            echo "**lint exit:** $LINT"\n            echo '```text'\n            tail -n 120 /tmp/lint.log\n            echo '```'\n          } > /tmp/diagnostics.md\n          gh pr comment 25 --body-file /tmp/diagnostics.md\n        env:\n          GH_TOKEN: ${{ github.token }}
